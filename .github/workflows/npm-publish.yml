name: NPM Package Publish

# Trigger: Tags v* (z.B. v1.2.3), manuell
# Publish: Ein NPM-Package "gatecore" mit gebautem Frontend + Backend
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # für npm provenance (Supply-Chain)

    steps:
      # 1) Repository auschecken (inkl. Tags für die Version)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Node.js Setup
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # 3) Abhängigkeiten installieren (Backend)
      - name: Install backend dependencies
        run: npm ci

      # 4) Frontend-Abhängigkeiten installieren
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # 5) Build (Frontend + Backend) → dist/
      - name: Build
        run: npm run build

      # 6) Version aus dem Git-Tag (z.B. v1.2.3 → 1.2.3) in package.json setzen
      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
        if: github.event_name == 'push'

      # 7) Publish auf npm (mit Provenance, ohne "latest"-Git-Log-Fehler)
      #    Prerelease-Versionen (z.B. v1.1.0-beta.1) → dist-tag "next",
      #    stabile Versionen → dist-tag "latest"
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "Prerelease erkannt (${VERSION}) → Publish mit dist-tag 'next'"
            npm publish --provenance --tag next
          else
            echo "Stable Release erkannt (${VERSION}) → Publish mit dist-tag 'latest'"
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
